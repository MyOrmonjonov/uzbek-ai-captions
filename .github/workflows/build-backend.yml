name: Build backend installers

# Runs automatically on every push to master that touches the plugin/backend source, and can
# still be triggered by hand (workflow_dispatch). Builds the desktop backend (Java, bundled with
# its own JRE and a static ffmpeg via jpackage) for both Windows and macOS, then uploads each
# package to the AWS server so the website's download buttons and the in-app update checks
# always serve whatever this workflow last produced. jpackage can only target the OS it runs on
# (no cross-compiling a macOS package from a Windows machine), which is the whole reason this
# needs CI rather than a local build script.
#
# Each job also assembles a single combined installer (cep-extension + the backend app-image +
# installer/"O'rnatish (…)" — copies the plugin into Adobe's CEP folder, installs the backend to
# a permanent location, and registers it to auto-start) — this is what the website's one
# "Yuklab olish" button links to, so a customer runs exactly one file instead of two separate
# downloads. Before assembling, scripts/obfuscate-plugin.sh runs against a copy of
# cep-extension/ so the shipped client/js/main.js and host/index.jsx aren't plainly readable
# straight out of the downloaded ZIP — the checked-in source stays untouched.
#
# The build-windows job additionally packages just the obfuscated cep-extension/ (as
# uzbek-ai-captions.zip, plus a VERSION file read from CSXS/manifest.xml's
# ExtensionBundleVersion) and uploads both to srt_bot/plugin-release/ — this is the separate
# in-panel auto-update path (main.js: checkForUpdate()/stageUpdate(), served by
# srt_bot/plugin_release.py's GET /plugin/version and /plugin/download), which already-installed
# users hit without ever visiting the website. It only needs building once (it's not
# OS-specific), hence living in the Windows job rather than being duplicated in the Mac job.
on:
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - "cep-extension/**"
      - "src/**"
      - "pom.xml"
      - "mvnw"
      - "mvnw.cmd"
      - "installer/**"
      - "scripts/obfuscate-plugin.sh"
      - ".github/workflows/build-backend.yml"

env:
  APP_NAME: UzbekAiCaptionsBackend
  APP_VERSION: "1.0.0"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download static ffmpeg (BtbN build)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extracted
          $bin = Get-ChildItem -Path ffmpeg-extracted -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path app-content/ffmpeg | Out-Null
          Copy-Item $bin.FullName app-content/ffmpeg/ffmpeg.exe

      - name: Build jar
        run: .\mvnw.cmd -q -DskipTests package
        shell: cmd

      - name: Package with jpackage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path jpackage-input | Out-Null
          Copy-Item target\Plugin-0.0.1-SNAPSHOT.jar jpackage-input\
          jpackage --input jpackage-input `
            --name $env:APP_NAME `
            --main-jar Plugin-0.0.1-SNAPSHOT.jar `
            --type app-image `
            --dest jpackage-out `
            --app-version $env:APP_VERSION `
            --vendor "Uzbek AI Captions" `
            --app-content app-content

      - name: Zip app-image
        shell: pwsh
        run: Compress-Archive -Path "jpackage-out/$env:APP_NAME" -DestinationPath "$env:APP_NAME-windows.zip" -Force

      - name: Obfuscate plugin source (client/js/main.js, host/index.jsx)
        shell: bash
        run: bash scripts/obfuscate-plugin.sh cep-extension cep-extension-obf

      - name: Assemble combined installer (plugin + backend + one install script)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path combined/plugin, combined/backend | Out-Null
          Copy-Item cep-extension-obf/CSXS combined/plugin/CSXS -Recurse
          Copy-Item cep-extension-obf/client combined/plugin/client -Recurse
          Copy-Item cep-extension-obf/host combined/plugin/host -Recurse
          Copy-Item "jpackage-out/$env:APP_NAME/*" combined/backend -Recurse
          Copy-Item "installer/O'rnatish (Windows).bat" combined/
          Compress-Archive -Path combined/* -DestinationPath RavonCaptions-windows.zip -Force

      - name: Package plugin auto-update zip (for already-installed users, not the website)
        shell: pwsh
        run: |
          $manifest = Get-Content cep-extension-obf/CSXS/manifest.xml -Raw
          if ($manifest -notmatch 'ExtensionBundleVersion="([^"]+)"') {
            throw "ExtensionBundleVersion not found in manifest.xml"
          }
          $version = $Matches[1]
          Set-Content -Path VERSION -Value $version -NoNewline -Encoding utf8

          New-Item -ItemType Directory -Force -Path plugin-zip/uzbek-ai-captions | Out-Null
          Copy-Item cep-extension-obf/CSXS plugin-zip/uzbek-ai-captions/CSXS -Recurse
          Copy-Item cep-extension-obf/client plugin-zip/uzbek-ai-captions/client -Recurse
          Copy-Item cep-extension-obf/host plugin-zip/uzbek-ai-captions/host -Recurse
          Compress-Archive -Path plugin-zip/uzbek-ai-captions -DestinationPath uzbek-ai-captions.zip -Force

      - name: Upload to server
        shell: bash
        env:
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/aws_key.pem
          chmod 600 ~/.ssh/aws_key.pem
          ssh -i ~/.ssh/aws_key.pem -o StrictHostKeyChecking=no ubuntu@aitilmoch.duckdns.org \
            "mkdir -p /home/ubuntu/uzbek-ai-captions/srt_bot/plugin-release/backend /home/ubuntu/uzbek-ai-captions/srt_bot/plugin-release/installer"
          scp -i ~/.ssh/aws_key.pem -o StrictHostKeyChecking=no \
            "${APP_NAME}-windows.zip" \
            ubuntu@aitilmoch.duckdns.org:/home/ubuntu/uzbek-ai-captions/srt_bot/plugin-release/backend/UzbekAiCaptionsBackend-windows.zip
          scp -i ~/.ssh/aws_key.pem -o StrictHostKeyChecking=no \
            RavonCaptions-windows.zip \
            ubuntu@aitilmoch.duckdns.org:/home/ubuntu/uzbek-ai-captions/srt_bot/plugin-release/installer/RavonCaptions-windows.zip
          scp -i ~/.ssh/aws_key.pem -o StrictHostKeyChecking=no \
            uzbek-ai-captions.zip VERSION \
            ubuntu@aitilmoch.duckdns.org:/home/ubuntu/uzbek-ai-captions/srt_bot/plugin-release/

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download static ffmpeg (evermeet.cx build)
        run: |
          curl -L -o ffmpeg.zip "https://evermeet.cx/ffmpeg/getrelease/zip"
          unzip -o ffmpeg.zip -d ffmpeg-extracted
          mkdir -p app-content/Resources/ffmpeg
          cp ffmpeg-extracted/ffmpeg app-content/Resources/ffmpeg/ffmpeg
          chmod +x app-content/Resources/ffmpeg/ffmpeg

      - name: Build jar
        run: |
          chmod +x mvnw
          ./mvnw -q -DskipTests package

      - name: Package with jpackage
        run: |
          mkdir -p jpackage-input
          cp target/Plugin-0.0.1-SNAPSHOT.jar jpackage-input/
          jpackage --input jpackage-input \
            --name "$APP_NAME" \
            --main-jar Plugin-0.0.1-SNAPSHOT.jar \
            --type app-image \
            --dest jpackage-out \
            --app-version "$APP_VERSION" \
            --vendor "Uzbek AI Captions" \
            --app-content app-content
          ditto -c -k --sequesterRsrc "jpackage-out/${APP_NAME}.app" "${APP_NAME}-mac.zip"

      - name: Obfuscate plugin source (client/js/main.js, host/index.jsx)
        run: bash scripts/obfuscate-plugin.sh cep-extension cep-extension-obf

      - name: Assemble combined installer (plugin + backend + one install script)
        run: |
          mkdir -p combined/plugin combined/backend
          cp -R cep-extension-obf/CSXS combined/plugin/CSXS
          cp -R cep-extension-obf/client combined/plugin/client
          cp -R cep-extension-obf/host combined/plugin/host
          cp -R "jpackage-out/${APP_NAME}.app" "combined/backend/${APP_NAME}.app"
          cp "installer/O'rnatish (Mac).command" combined/
          chmod +x "combined/O'rnatish (Mac).command"
          ditto -c -k --sequesterRsrc combined RavonCaptions-mac.zip

      - name: Upload to server
        env:
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/aws_key.pem
          chmod 600 ~/.ssh/aws_key.pem
          ssh -i ~/.ssh/aws_key.pem -o StrictHostKeyChecking=no ubuntu@aitilmoch.duckdns.org \
            "mkdir -p /home/ubuntu/uzbek-ai-captions/srt_bot/plugin-release/backend /home/ubuntu/uzbek-ai-captions/srt_bot/plugin-release/installer"
          scp -i ~/.ssh/aws_key.pem -o StrictHostKeyChecking=no \
            "${APP_NAME}-mac.zip" \
            ubuntu@aitilmoch.duckdns.org:/home/ubuntu/uzbek-ai-captions/srt_bot/plugin-release/backend/UzbekAiCaptionsBackend-mac.zip
          scp -i ~/.ssh/aws_key.pem -o StrictHostKeyChecking=no \
            RavonCaptions-mac.zip \
            ubuntu@aitilmoch.duckdns.org:/home/ubuntu/uzbek-ai-captions/srt_bot/plugin-release/installer/RavonCaptions-mac.zip