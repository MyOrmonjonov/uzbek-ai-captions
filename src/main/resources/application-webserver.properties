# Headless "web mode" profile: runs as a second process on the AWS box (aitilmoch.duckdns.org)
# alongside srt_bot, behind nginx at /videocaption-api/, serving the browser-based video-upload
# caption tool. Never exposed directly to the internet — server.address binds to loopback only,
# same box as srt_bot so the license/whisper server URLs go straight to localhost, no TLS hop.
server.port=8972
server.address=127.0.0.1
plugin.ffmpeg-path=ffmpeg
plugin.license.server-url=http://127.0.0.1:8899/license/verify
plugin.whisper.server-url=http://127.0.0.1:8899/transcribe
plugin.translate.server-url=http://127.0.0.1:8899/transcribe-translate
plugin.broll.server-url=http://127.0.0.1:8899/broll-suggestions
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
plugin.web.max-concurrent-jobs=2
plugin.web.queue-capacity=6
plugin.web.free-uploads-per-ip-per-day=3
plugin.web.job-retention-hours=2
